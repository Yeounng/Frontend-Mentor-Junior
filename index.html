<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./style.css" />
    <script defer src="./main.js"></script>
    <title>Frontend Mentor | Tip calculator app</title>
  </head>
  <body>
    <section class="app">
      <div class="logo"><img src="./images/logo.svg" alt="" /></div>
      <div class="container">
        <div class="calc-main">
          <label for="main-input">Bill</label>
          <input type="text" class="bill" id="main-input" placeholder="0" />

          <div class="calc-tipping">
            <p class="guide-message">Select Tip %</p>
            <div class="tipping-grid">
              <div class="grid-item">5</div>
              <div class="grid-item">10</div>
              <div class="grid-item">15</div>
              <div class="grid-item">25</div>
              <div class="grid-item">50</div>
              <div class="grid-item">
                Custom
                <input type="text" id="custom" placeholder="Custom" />
              </div>
            </div>
          </div>
          <div class="people-message">
            <label for="num-ppl">Number of People</label>
            <span class="zero-alert"></span>
          </div>
          <input type="text" class="num-ppl" id="num-ppl" placeholder="0" />
        </div>
        <div class="calc-result">
          <div class="result-box">
            <div class="textbox">
              <strong>Tip Amount</strong>
              <p>/ person</p>
            </div>
            <div class="price" id="price-total">0.00</div>
          </div>
          <div class="result-box">
            <div class="textbox">
              <strong>Total</strong>
              <p>/ person</p>
            </div>
            <div class="price" id="price-to-pay">0.00</div>
          </div>
          <button class="reset" type="reset">RESET</button>
        </div>
      </div>
    </section>
  </body>
</html>
